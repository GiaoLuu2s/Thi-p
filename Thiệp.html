<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tặng em 💌</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #e74c3c;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 18px;
            line-height: 1.8;
        }
        .heart {
            font-size: 50px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">💖</div>
        <h1>Chào em bé của anh!</h1>
        <p>Chúc em 1 tuổi mới vui vẻ, hạnh phúc bên gia đình và anh💖 ,<br>
        mọi điều tốt đẹp nhất sẽ đến với embe của anh💖!<br>
        ✨✨✨</p>
        <br>
        <p><em>— Anh Yêu Em💖 —</em></p>
    </div>
</body>
</html>
